# 📊 Generate 3D Contribution Calendar
# Creates stunning 3D visualization of your GitHub contribution graph
# The generated SVGs are committed directly to the main branch

name: Generate 3D Contribution

on:
  # Runs automatically every day at 1:00 AM UTC
  schedule:
    - cron: "0 1 * * *"

  # Runs on push to main
  push:
    branches:
      - main

  # Allows manual trigger
  workflow_dispatch:

jobs:
  contrib:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate 3D Contribution Calendar
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: MenBoyVN2910

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "🎨 Update 3D contribution calendar"
          git push
