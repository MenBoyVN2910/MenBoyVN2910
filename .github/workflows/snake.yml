# 🐍 Generate Snake Animation from GitHub Contribution Graph
# This workflow creates a snake animation that eats your contributions
# The generated SVGs are pushed to the 'output' branch

name: Generate Snake Animation

on:
  # Runs automatically every day at midnight UTC
  schedule:
    - cron: "0 0 * * *"
  
  # Runs on every push to main branch
  push:
    branches:
      - main

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate Snake Animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: MenBoyVN2910
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
